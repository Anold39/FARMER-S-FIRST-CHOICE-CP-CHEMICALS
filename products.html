    <section class="container section-margin">
        <br><h2 class="section-title">Our 2026 Product Catalog</h2>

    <script src="products-data.js"></script>
    <script src="script.js"></script>
    <script>
        // Synchronize cart count when DOM loads, and render the product table from the shared data source
        document.addEventListener("DOMContentLoaded", () => {
            updateCartCountHeader();
            renderProductTable();
        });

        function escapeHTMLProducts(str) {
            return String(str == null ? '' : str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function renderProductTable() {
            const products = getProducts();
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = products.map(p => {
                const status = getStockStatus(p.stock);
                const disabled = p.stock <= 0 ? 'disabled' : '';
                return `
                    <tr>
                        <td><img src="${escapeHTMLProducts(p.image)}" alt="${escapeHTMLProducts(p.name)}" class="table-img"></td>
                        <td><b>${escapeHTMLProducts(p.name)}</b><br><small>${escapeHTMLProducts(p.description)}</small></td>
                        <td>${escapeHTMLProducts(p.category)}</td>
                        <td>${escapeHTMLProducts(p.unitSize)}</td>
                        <td>$${parseFloat(p.price).toFixed(2)}</td>
                        <td><span class="${status.cssClass}">${escapeHTMLProducts(status.label)}</span></td>
                        <td><input type="number" id="qty-${p.id}" value="1" min="1" max="${p.stock}" class="qty-input" ${disabled}></td>
                        <td><button class="btn-shop" ${disabled} onclick="addToCart('${escapeHTMLProducts(p.name).replace(/'/g,"\\'")}', ${p.price}, 'qty-${p.id}', this)">${p.stock <= 0 ? 'Out of Stock' : 'Add'}</button></td>
                    </tr>`;
            }).join('');
        }

        // Universal Shared Cart Reader/Writer using 'cp_cart' -- now stock-aware
        function addToCart(productName, price, qtyInputId, btnElement) {
            const product = findProductByName(productName);
            const qtyInput = document.getElementById(qtyInputId);
            let quantity = parseInt(qtyInput ? qtyInput.value : 1) || 1;

            if (product && quantity > product.stock) {
                alert(`Only ${product.stock} unit(s) of "${productName}" are currently in stock. Quantity adjusted.`);
                quantity = product.stock;
                if (qtyInput) qtyInput.value = quantity;
            }
            if (quantity <= 0) return;

            let cart = JSON.parse(localStorage.getItem('cp_cart')) || [];
            
            const existingIndex = cart.findIndex(item => item.name === productName);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    name: productName,
                    price: parseFloat(price),
                    quantity: quantity
                });
            }

            localStorage.setItem('cp_cart', JSON.stringify(cart));
            updateCartCountHeader();

            // Visual feedback on button
            if (btnElement) {
                const originalText = btnElement.innerText;
                btnElement.innerText = "Added!";
                btnElement.style.background = "#1b5e20";
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = "";
                }, 1500);
            }
        }

        function updateCartCountHeader() {
            const cart = JSON.parse(localStorage.getItem('cp_cart')) || [];
            const totalCount = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 0), 0);
            const badge = document.getElementById('cart-count');
            if (badge) {
                badge.innerText = totalCount;
            }
        }

        // Live table filtering function
        function filterProducts() {
            const input = document.getElementById("productSearch");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("productTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let rowText = tr[i].textContent || tr[i].innerText;
                if (rowText.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    </script>
</body>
