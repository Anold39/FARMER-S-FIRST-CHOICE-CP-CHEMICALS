<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom Article | CP Chemicals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        main { padding-top: 120px; max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .story-header { border-bottom: 2px solid #2e7d32; margin-bottom: 30px; padding-bottom: 10px; }
        .badge { background: #2e7d32; color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
        .date { color: #777; font-size: 0.9rem; margin-top: 10px; display: block; }
        .content { line-height: 1.8; color: #333; font-size: 1.1rem; white-space: pre-wrap; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #2e7d32; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { color: #1b5e20; transform: translateX(-5px); }
        p { margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="20th Anniversary.png" alt="20th Anniversary" class="Anniversary">
                    <span class="intro-hint"><i class="fas fa-play-circle"></i></span>
                </a>
            </div>
            <ul class="nav-links">
                <li><button><a href="home.html">Home</a></button></li>
                <li><button><a href="news.html">Newsroom</a></button></li>
                <li><button><a href="agritalk.html">Agri-Talk</a></button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <br> <br> <br> <br><a href="news.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Newsroom</a>
        <article id="articleContainer">
            <p style="text-align:center; color:#888; padding:40px;">Loading article...</p>
        </article>
    </main>

     <footer>
        <div class="social-links">
            <a href="https://share.google/gHRP1nYVd6uUMx2Lu" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://share.google/m4RnzcG3EDBcL40NN" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/263777379313" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://share.google/j2qOR9dEkIJhUSEXc" target="_blank"><i class="fab fa-x-twitter"></i></a>
        </div>
        <p>&copy; 2026 CP Chemicals PVT Limited. All Rights Reserved.</p>
        <br>
        <a href="staff_login.html" style="color: #777; font-size: 0.75rem; text-decoration: none;">
            <i class="fas fa-lock"></i> Authorized Staff Portal
        </a>
    </footer>

    <script type="module" src="firebase-init.js"></script>
    <script src="news-data.js"></script>
    <script>
        function escapeHTMLArticle(str) {
            return String(str == null ? '' : str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function renderArticle() {
            const container = document.getElementById('articleContainer');
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                container.innerHTML = '<p style="text-align:center; color:#888; padding:40px;">No article specified. <a href="news.html">Return to Newsroom</a>.</p>';
                return;
            }

            const article = await getNewsArticleById(id);
            if (!article) {
                container.innerHTML = '<p style="text-align:center; color:#888; padding:40px;">Article not found -- it may have been removed. <a href="news.html">Return to Newsroom</a>.</p>';
                return;
            }

            document.title = article.title + ' | CP Chemicals';

            const imageHtml = article.image
                ? `<img src="${article.image}" alt="${escapeHTMLArticle(article.title)}" style="width:100%; max-height:400px; object-fit:cover; border-radius:8px; margin-bottom:20px;">`
                : '';

            const videoHtml = article.videoUrl
                ? `<div style="position:relative; padding-bottom:56.25%; height:0; margin-bottom:20px; border-radius:8px; overflow:hidden;">
                       <iframe src="${article.videoUrl}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen loading="lazy"></iframe>
                   </div>`
                : '';

            container.innerHTML = `
                <div class="story-header">
                    <span class="badge">${escapeHTMLArticle(article.badge)}</span>
                    <span class="date">${escapeHTMLArticle(article.date)}</span>
                    <h1>${escapeHTMLArticle(article.title)}</h1>
                </div>
                ${imageHtml}
                ${videoHtml}
                <div class="content">${escapeHTMLArticle(article.content)}</div>
            `;
        }

        document.addEventListener('DOMContentLoaded', renderArticle);
    </script>
</body>
</html>
