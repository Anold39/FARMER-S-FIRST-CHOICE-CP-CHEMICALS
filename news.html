    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Fix for hidden heading under fixed header */
        main {
            padding-top: 120px; /* Adjust this value if your header is taller */
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .news-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            border-top: 5px solid #2e7d32;
        }
        .news-card:hover { transform: translateY(-5px); }
        
        .news-body { padding: 25px; }
        
        .badge {
            background: #2e7d32;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
        }
        .news-date { color: #777; font-size: 0.85rem; margin-top: 10px; display: block; }
        .news-body h3 { margin: 15px 0 10px 0; color: #1a1a1a; }
        .news-body p { color: #555; line-height: 1.6; }
    </style>
</head>

                </a></button></li>
                <li><button><a href="order_history.html">My Orders</a></button></li>
                <li><button><a href="farmer_login.html">Farmer Registration</a></button></li>
            </ul>

    <main class="container section-margin">
       <br><h2 class="section-title">CP Chemicals Newsroom</h2>

    <script type="module" src="firebase-init.js"></script>
    <script src="news-data.js"></script>
    <script src="script.js"></script>
    <script>
        function escapeHTMLNews(str) {
            return String(str == null ? '' : str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function renderNewsGrid() {
            const grid = document.getElementById('newsGrid');
            const articles = await getNewsArticles();

            if (articles.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#888;">No articles published yet.</p>';
                return;
            }

            grid.innerHTML = articles.map(a => {
                // Legacy (original 3) articles link to their own existing hand-built page; every
                // new article added via manage_news.html goes through the dynamic viewer instead.
                const link = a.legacyUrl ? a.legacyUrl : `news_article.html?id=${a.firestoreId}`;
                return `
                <article class="news-card">
                    <div class="news-body">
                        <span class="badge">${escapeHTMLNews(a.badge)}</span>
                        <span class="news-date">${escapeHTMLNews(a.date)}</span>
                        <h3>${escapeHTMLNews(a.title)}</h3>
                        <p>${escapeHTMLNews(a.excerpt)}</p>
                        <a href="${link}" class="product-link">Read Full Story</a>
                    </div>
                </article>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', renderNewsGrid);
    </script>

</body>
