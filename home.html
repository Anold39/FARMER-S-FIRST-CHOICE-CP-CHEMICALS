    <script>
        // Direct Override to prevent cached navbar numbers on Home landing
        function syncHomeCart() {
            const raw = localStorage.getItem('CP_CART') || localStorage.getItem('cp_cart');
            const cartData = raw ? JSON.parse(raw) : [];
            const total = cartData.reduce((sum, item) => sum + (parseInt(item.qty || item.quantity) || 1), 0);
            const badge = document.getElementById('cart-count');
            if (badge) badge.innerText = total;
        }

        document.addEventListener('DOMContentLoaded', syncHomeCart);
        window.addEventListener('pageshow', syncHomeCart);
    </script>
